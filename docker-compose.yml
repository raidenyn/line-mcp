services:
  line-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - BASE_PATH=/
    volumes:
      - line-mcp-data:/data
    healthcheck:
      test: ["CMD-SHELL", "BASE_PATH=$${BASE_PATH%/}; wget -qO- http://localhost:3000$${BASE_PATH}/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  line-mcp-data:
