# Default service is the COMPOSED server (ten tools: five messenger + five
# bank). The standalone messenger-only server is defined under the "standalone"
# profile and MUST use its own data volume — the two servers never share a data
# root on the same host (the composed server owns bank/category data the
# standalone server knows nothing about, and the standalone server refuses to
# start against a legacy pre-migration combined database). Start the standalone
# variant explicitly with:  docker compose --profile standalone up line-mcp-standalone
services:
  line-mcp:
    build:
      context: .
      target: server
    ports:
      - "3000:3000"
    environment:
      - BASE_PATH=/
      - PORT=3000
    volumes:
      - line-mcp-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"let p=process.env.BASE_PATH||'';let bp=p.replace(/\\/+$/,'');if(bp&&!bp.startsWith('/'))bp='/'+bp;require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:bp+'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  line-mcp-standalone:
    profiles: ["standalone"]
    build:
      context: .
      target: line-mcp
    ports:
      - "3100:3000"
    environment:
      - BASE_PATH=/
      - PORT=3000
    # A SEPARATE volume from the composed server — never reuse line-mcp-data.
    volumes:
      - line-mcp-standalone-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"let p=process.env.BASE_PATH||'';let bp=p.replace(/\\/+$/,'');if(bp&&!bp.startsWith('/'))bp='/'+bp;require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:bp+'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  line-mcp-data:
  line-mcp-standalone-data:
