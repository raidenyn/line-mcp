schema: superspec

# Per-artifact rules appended to the schema's built-in guidance.
rules:
  tasks:
    - "Every task ends with `Verify: <exact command>`."

# Advisory guidance for the apply operation.
operations:
  apply:
    guidance:
      - "Use superpowers:test-driven-development for every task (red → green per task)."
      - "Keep handoff.md in the change folder up to date before ending a session. Template: openspec/templates/handoff.md."
