# Publishes both runtime targets to GitHub Container Registry as public images.
# GHCR only: every image bundles LINE's proprietary LTSM assets, and the owner
# accepted that redistribution risk permanently on 2026-11-16 — see
# packages/line-client/THIRD_PARTY_NOTICES.md. Registry authentication uses the
# built-in GITHUB_TOKEN under `packages: write`; no personal access token is
# stored. Do not add a Docker Hub or other registry push.
#
# The workflow runs only when the Release workflow calls it, or when the
# `publish-docker` label is added to a same-repository pull request. A release
# call builds the commit the caller planned and pushes the version tags; a
# pull-request build pushes only `pr-<number>` and `sha-<short>`.
name: Publish Docker

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z), planned by the Release workflow.
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'raidenyn/line-mcp'
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      latest: ${{ steps.resolve.outputs.latest }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      major: ${{ steps.resolve.outputs.major }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - name: Resolve publication inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          publish=true
          latest=false
          major=''
          tag=''
          pr=''
          sha="$SHA"
          short_sha="${sha:0:7}"
          ref="$sha"

          write_outputs() {
            {
              printf 'publish=%s\n' "$publish"
              printf 'tag=%s\n' "$tag"
              printf 'pr=%s\n' "$pr"
              printf 'sha=%s\n' "$sha"
              printf 'short_sha=%s\n' "$short_sha"
              printf 'major=%s\n' "$major"
              printf 'latest=%s\n' "$latest"
              printf 'ref=%s\n' "$ref"
            } >> "$GITHUB_OUTPUT"
          }

          # Publishing a pull request is an explicit one-shot request: only the
          # `labeled` event reaches this script, another label publishes
          # nothing, and a fork head is refused before the protected
          # environment deployment is requested.
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            if [ "${PR_LABEL:-}" != 'publish-docker' ]; then
              publish=false
              write_outputs
              exit 0
            fi
            if [ "${PR_HEAD_REPO:-}" != "$GITHUB_REPOSITORY" ]; then
              publish=false
              printf '::warning::fork pull requests cannot publish images; only same-repository pull requests are supported\n' >&2
              write_outputs
              exit 0
            fi
            pr="${PR_NUMBER:-}"
            sha="${PR_HEAD_SHA:-}"
            short_sha="${sha:0:7}"
            ref="$sha"
            write_outputs
            exit 0
          fi

          # A release build exists only as part of the Release workflow: a
          # called workflow sees the caller's event, ref, workflow ref and
          # commit, so any other caller fails here, before a push.
          if [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            printf '::error::Publish Docker runs only as part of Release or a labeled pull request, not on %s\n' "$EVENT_NAME" >&2
            exit 1
          fi

          if [ "${WORKFLOW_REF:-}" != "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" ]; then
            printf '::error::Publish Docker may be called only by .github/workflows/release.yml on refs/heads/main, not %s\n' "${WORKFLOW_REF:-}" >&2
            exit 1
          fi

          if [ "${REF:-}" != 'refs/heads/main' ]; then
            printf '::error::Release must call Publish Docker from refs/heads/main, not %s\n' "${REF:-}" >&2
            exit 1
          fi

          tag="${TAG:-}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::unsupported tag %s: expected vX.Y.Z\n' "$tag" >&2
            exit 1
          fi

          major="${tag#v}"
          major="${major%%.*}"

          REMOTE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          # The tag is created only after the images are published, so the
          # planned commit is the caller's commit. "Newest" compares the remote
          # stable tags together with the tag being published, and a failed
          # listing fails the run rather than guessing at `latest`.
          if ! listing=$(git ls-remote --tags --refs --sort=-v:refname "$REMOTE" 'v*'); then
            printf '::error::cannot list release tags from %s\n' "$REMOTE" >&2
            exit 1
          fi
          stable=$(printf '%s\n' "$listing" \
            | sed 's#.*refs/tags/##' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; })
          newest=$(printf '%s\n%s\n' "$stable" "$tag" \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V \
            | tail -n1)
          if [ "$newest" = "$tag" ]; then
            latest=true
          fi

          write_outputs

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: line-mcp-full
          - target: line-mcp
            image: line-mcp
    steps:
      - name: Check out the resolved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # A tag moved between resolution and checkout would mislabel the image.
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The built-in workflow token carries `packages: write` on this job; the
      # protected environment keeps the owner approval as an abuse control.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta-release
        if: needs.prepare.outputs.tag != ''
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.licenses=NOASSERTION
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.latest == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.latest == 'true' && needs.prepare.outputs.major != '0' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      # A PR image is addressed only by its pull request and commit; it never
      # receives `latest` or a release tag.
      - name: Metadata (pull request)
        id: meta-pr
        if: needs.prepare.outputs.pr != ''
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.licenses=NOASSERTION
          tags: |
            type=raw,value=pr-${{ needs.prepare.outputs.pr }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      # Checked immediately before the push: a pull-request build may push only
      # its `pr-<number>` and `sha-<short>` tags, and a release build may never
      # push a pull-request tag.
      - name: Assert tag allowlist
        env:
          PR: ${{ needs.prepare.outputs.pr }}
          TAGS: ${{ steps.meta-release.outputs.tags || steps.meta-pr.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${PR:-}" ]; then
            allowed='^(pr-[0-9]+|sha-[0-9a-f]{7})$'
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              tag="${ref##*:}"
              if ! [[ "$tag" =~ $allowed ]]; then
                printf '::error::pull-request build computed a forbidden tag %s\n' "$tag" >&2
                exit 1
              fi
            done <<< "${TAGS:-}"
          else
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              tag="${ref##*:}"
              case "$tag" in
                pr-*)
                  printf '::error::release build computed a pull-request tag %s\n' "$tag" >&2
                  exit 1
                  ;;
              esac
            done <<< "${TAGS:-}"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # The cache holds image layers, so it lives in the same GHCR package as
          # the image: a GHA cache is restorable by fork pull-request workflows.
          # The GHCR login above makes these registry cache pushes and pulls
          # authenticated.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
          labels: ${{ steps.meta-release.outputs.labels || steps.meta-pr.outputs.labels }}
          tags: ${{ steps.meta-release.outputs.tags || steps.meta-pr.outputs.tags }}
