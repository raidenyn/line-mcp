name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Conventional Commits gate: validates PR commit messages (range), the
  # squash-merge PR title, and (on push to main) the new commits — including
  # the all-zero `before` (initial push / force-push) edge case. Runs before
  # the deterministic `check` job; no LINE credentials, no Docker.
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      - name: Validate pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Validate initial pushed commit
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: git show -s --format=%B "${{ github.sha }}" | pnpm exec commitlint

  # Deterministic, merge-blocking gate: lint, composite build, the full
  # unit/contract/migration suite, strict OpenSpec validation, the package
  # import-boundary test, and a peer-dependency check. Requires no LINE credentials and no Docker.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the pull-request / push range, so the checkout
          # needs the history behind both endpoints.
          fetch-depth: 0

      - name: Secret scan (gitleaks, changed commits)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          GITLEAKS_VERSION: 8.30.1
          # Pinned release asset digest, not the release's checksums file (which
          # comes from the same mutable release and so cannot prove integrity).
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          arch="linux_x64"
          asset="gitleaks_${GITLEAKS_VERSION}_${arch}.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${release}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" -C "$RUNNER_TEMP" gitleaks
          rm -f "${asset}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            # Initial push: scan the pushed commit only, never all of history.
            log_opts="-1 ${head_sha}"
          elif git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            log_opts="${base_sha}..${head_sha}"
          else
            echo "::error::gitleaks base commit ${base_sha} is not in the checkout"
            exit 1
          fi

          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --log-opts="$log_opts" \
            --verbose

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The agent harness tools in .agents/harness/ are copied from the
      # published catalog and never edited here; `check` fails on any copied
      # file that differs from .agents/harness/lock.json, and on config errors.
      - name: Check the agent harness hook runtime copy and settings
        run: node .agents/harness/hook-runtime/cli.mjs check

      - name: Check the agent harness verify gate copy and settings
        run: node .agents/harness/verify-gate/cli.mjs check

      - name: Lint
        run: pnpm run lint

      - name: Build (tsc -b, all six packages)
        run: pnpm run build

      - name: Unit / contract / migration tests
        run: pnpm run test:unit

      - name: Validate OpenSpec specs (strict)
        run: pnpm exec openspec validate --all --strict

      - name: Package import-boundary test
        run: pnpm exec vitest run tests/architecture/import-boundaries.test.ts

      - name: Peer dependency check
        run: node scripts/check-peers.mjs

  # Artifact gate for @raidenyn/line-client: a real `npm pack`, a clean offline
  # install into a directory outside the checkout, a TypeScript compile against
  # the installed package, a real (non-mocked) WASM HMAC operation, and proof
  # the packed core carries no better-sqlite3. This is exactly the coverage in
  # tests/artifacts/line-client-pack.test.ts. It is a packing/consumption smoke
  # test only — never an `npm publish` (see packages/line-client/THIRD_PARTY_NOTICES.md).
  pack-line-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (needed for pack + the consumer tsc compile)
        run: pnpm run build

      - name: Pack / install / load / compile / WASM / no-SQLite
        run: pnpm exec vitest run tests/artifacts/line-client-pack.test.ts

  # Docker gate: build both runtime targets and smoke each running container
  # over a real MCP tools/list roundtrip (composed = twelve tools, standalone =
  # five). Proves better-sqlite3's native addon loads inside the runtime image.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (the smoke test mints a token via the built @raidenyn/mcp-runtime)
        run: pnpm run build

      - name: Build composed server image
        run: docker build --target server -t line-mcp-server:test .

      - name: Build standalone line-mcp image
        run: docker build --target line-mcp -t line-mcp-standalone:test .

      - name: Smoke both containers (healthz + real MCP tools/list)
        run: pnpm exec vitest run tests/docker/docker-smoke.test.ts

  # Mock-backed LINE smoke gate: runs `pnpm run test:smoke`, which builds the
  # workspace once and then exercises both compiled CLI targets (the composed
  # server and the standalone line-mcp server) against a strict, in-process LINE
  # gateway mock. Covers seeded-credential and full-OAuth (PKCE/PIN/certificate
  # reuse/token refresh) scenarios for both targets, asserting the composed ten
  # tool surface and the standalone five. Requires no LINE credentials and no
  # Docker.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Mock-backed LINE smoke tests
        run: pnpm run test:smoke

  # NOTE: the live LINE end-to-end suite (`pnpm run test:e2e`) is deliberately
  # NOT part of this PR-blocking workflow. It requires a real `.line-auth.json`
  # LINE session and is run manually as a pre-release check (see README.md).
