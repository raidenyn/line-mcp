name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Conventional Commits gate: validates PR commit messages (range), the
  # squash-merge PR title, and (on push to main) the new commits — including
  # the all-zero `before` (initial push / force-push) edge case. Runs before
  # the deterministic `check` job; no LINE credentials, no Docker.
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npm run commitlint -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint

      - name: Validate pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run commitlint -- --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Validate initial pushed commit
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: git show -s --format=%B "${{ github.sha }}" | npm run commitlint

  # Deterministic, merge-blocking gate: lint, composite build, the full
  # unit/contract/migration suite, the package import-boundary test, and a
  # dependency-closure check. Requires no LINE credentials and no Docker.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc -b, all six packages)
        run: npm run build

      - name: Unit / contract / migration tests
        run: npm run test:unit

      - name: Package import-boundary test
        run: npx vitest run tests/architecture/import-boundaries.test.ts

      - name: Dependency-closure check
        run: npm ls --all

  # Artifact gate for @raidenyn/line-client: a real `npm pack`, a clean offline
  # install into a directory outside the checkout, a TypeScript compile against
  # the installed package, a real (non-mocked) WASM HMAC operation, and proof
  # the packed core carries no better-sqlite3. This is exactly the coverage in
  # tests/artifacts/line-client-pack.test.ts. It is a packing/consumption smoke
  # test only — never an `npm publish` (see packages/line-client/THIRD_PARTY_NOTICES.md).
  pack-line-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (needed for pack + the consumer tsc compile)
        run: npm run build

      - name: Pack / install / load / compile / WASM / no-SQLite
        run: npx vitest run tests/artifacts/line-client-pack.test.ts

  # Docker gate: build both runtime targets and smoke each running container
  # over a real MCP tools/list roundtrip (composed = ten tools, standalone =
  # five). Proves better-sqlite3's native addon loads inside the runtime image.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (the smoke test mints a token via the built @raidenyn/mcp-runtime)
        run: npm run build

      - name: Build composed server image
        run: docker build --target server -t line-mcp-server:test .

      - name: Build standalone line-mcp image
        run: docker build --target line-mcp -t line-mcp-standalone:test .

      - name: Smoke both containers (healthz + real MCP tools/list)
        run: npx vitest run tests/docker/docker-smoke.test.ts

  # Mock-backed LINE smoke gate: runs `npm run test:smoke`, which builds the
  # workspace once and then exercises both compiled CLI targets (the composed
  # server and the standalone line-mcp server) against a strict, in-process LINE
  # gateway mock. Covers seeded-credential and full-OAuth (PKCE/PIN/certificate
  # reuse/token refresh) scenarios for both targets, asserting the composed ten
  # tool surface and the standalone five. Requires no LINE credentials and no
  # Docker.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Mock-backed LINE smoke tests
        run: npm run test:smoke

  # NOTE: the live LINE end-to-end suite (`npm run test:e2e`) is deliberately
  # NOT part of this PR-blocking workflow. It requires a real `.line-auth.json`
  # LINE session and is run manually as a pre-release check (see README.md).
